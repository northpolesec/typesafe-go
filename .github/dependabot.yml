version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    groups:
      all-go-updates:
        patterns: ["*"]
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
